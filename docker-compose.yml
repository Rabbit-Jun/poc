# 실행: docker compose up        (백그라운드: docker compose up -d)
# GPU 없이도 동작합니다(CPU 폴백). GPU 서버는 아래 "GPU 서버" 주석 참고.
services:
  clothing-api:
    image: rabbitjun/clothing-api      # Docker Hub 이미지 사용
    # build: .                          # ← 로컬에서 직접 빌드하려면 위 image 대신 이 줄
    platform: linux/amd64              # 이미지가 amd64 전용 → arm64(Mac)에선 에뮬레이션 필요
    ports:
      - "8000:8000"
    volumes:
      # 누끼 저장 폴더를 "컨테이너 밖"(호스트 ./static)에 연결 → 백엔드가 읽고, 종료해도 유지
      - ./static:/app/static
      # HF 모델 캐시 재사용(다운로드 생략)
      - ~/.cache/huggingface:/root/.cache/huggingface

  # ── 백엔드도 같은 볼륨을 공유하는 예시 (팀 백엔드 이미지로 교체) ──
  # backend:
  #   image: your-backend-image
  #   volumes:
  #     - ./static:/app/static        # API가 저장한 누끼를 같은 폴더에서 읽음

# ── GPU 서버(NVIDIA)는 이 파일 말고 docker-compose.gpu.yml 하나만 쓰면 됩니다 ──
#   docker compose -f docker-compose.gpu.yml up
# 이 파일(docker-compose.yml)은 GPU 없는 환경 전용:  docker compose up  (CPU 폴백)
